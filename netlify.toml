[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["src/data/**"]

[build.environment]
  NODE_VERSION = "22"

# SPA fallback — function paths (/api/*) are matched before this.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
